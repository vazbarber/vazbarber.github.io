<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Agenda</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="page-admin">
  <div class="pole" aria-hidden="true"></div>
  <header class="admin-top">
    <div class="admin-top-inner">
      <p class="admin-brand"><img src="assets/logo.png" alt="Vaz Barber" data-bind-alt="BUSINESS_NAME">Agenda</p>
      <button class="btn-ghost" id="logout" hidden>Sair</button>
    </div>
  </header>

  <main class="admin-main">
    <p class="demo-banner" id="demo-banner" hidden>
      Modo demonstração: as marcações são de exemplo e os botões não enviam emails.
    </p>

    <!-- Entrar -->
    <form class="login" id="login" hidden>
      <h2>Entrar na agenda</h2>
      <label class="field"><span>Email</span><input name="email" type="email" autocomplete="username" required></label>
      <label class="field"><span>Palavra-passe</span><input name="password" type="password" autocomplete="current-password" required></label>
      <p class="form-error" id="login-error" hidden></p>
      <button class="btn-primary" type="submit">Entrar</button>
      <p class="fineprint"><button type="button" class="linkish linkish-plain" id="forgot">Esqueci-me da palavra-passe</button></p>
    </form>

    <!-- Nova palavra-passe (depois do link de recuperação) -->
    <form class="login" id="newpass" hidden>
      <h2>Escolher nova palavra-passe</h2>
      <label class="field"><span>Nova palavra-passe</span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="btn-primary" type="submit">Guardar</button>
    </form>

    <!-- Agenda -->
    <div id="agenda" hidden>
      <section class="admin-section">
        <h2>Por aprovar <span class="count" id="n-pending"></span></h2>
        <div id="pending"></div>
      </section>

      <section class="admin-section">
        <h2>Próximas marcações</h2>
        <div id="upcoming"></div>
      </section>

      <section class="admin-section">
        <h2>Folgas e horas bloqueadas</h2>
        <form class="timeoff-form" id="timeoff-form">
          <label class="field"><span>De (dia)</span><input type="date" name="from_day" required></label>
          <label class="field"><span>Hora <em>(vazio = dia todo)</em></span><input type="time" name="from_time"></label>
          <label class="field"><span>Até (dia)</span><input type="date" name="to_day" required></label>
          <label class="field"><span>Hora <em>(vazio = dia todo)</em></span><input type="time" name="to_time"></label>
          <label class="field"><span>Motivo <em>(só tu vês)</em></span><input name="reason" maxlength="100" placeholder="Férias"></label>
          <button class="btn-primary" type="submit">Bloquear</button>
        </form>
        <ul class="timeoff-list" id="timeoff"></ul>
      </section>

      <section class="admin-section">
        <details class="history">
          <summary>Histórico (últimas 50)</summary>
          <div id="history"></div>
        </details>
      </section>
    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="assets/shared.js"></script>
  <script src="assets/admin.js"></script>
</body>
</html>
