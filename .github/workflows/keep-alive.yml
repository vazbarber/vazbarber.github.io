# Mantém o projeto Supabase gratuito acordado (é pausado após 7 dias sem atividade).
# Precisa de dois "secrets" no repositório: SUPABASE_URL e SUPABASE_ANON_KEY
# (GitHub → Settings → Secrets and variables → Actions → New repository secret)
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 8 */3 * *"   # de 3 em 3 dias
  workflow_dispatch:         # permite correr à mão no separador Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pedir a lista de serviços
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS "$URL/rest/v1/services?select=id&limit=1" \
            -H "apikey: $KEY"
